spring.application.name=CRUD-MUNDIAL-FELIPE-APIREST
server.port=8093

# MongoDB: si usas Atlas, puedes poner tu URI en la variable MONGODB_URI.
# Si no existe, usa MongoDB local.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/crud_mundial_apirest}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
